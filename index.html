<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Chengyima | Environment Art Portfolio</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#111;color:#eee;max-width:1100px;margin:0 auto;padding:40px 20px}
        h1{font-size:36px;margin-bottom:12px}
        .desc{color:#aaa;margin-bottom:40px;max-width:700px}
        .work{margin-bottom:60px}
        .work img, .work video{width:100%;border-radius:8px;margin:16px 0}
        h2{margin:24px 0 8px;color:#fff}
        p{color:#ccc;line-height:1.6}
        .contact{margin-top:80px;padding-top:30px;border-top:1px solid #333}
    </style>
</head>
<body>
    <h1>Chengyima｜UE5 环境地编</h1>
    <p class="desc">Environment Artist，擅长白盒搭建、资产整合、材质与光影氛围制作，熟悉Nanite、Lumen，掌握AI辅助资产工作流。</p>

    <div class="work">
        <h2>🌲 写实森林场景</h2>
        <p>白盒搭建空间布局，使用PCG生成植被，雕刻自然地形，完成灯光与氛围调试。</p>
        <video width="100%" controls>
            <source src="images/forest.mp4" type="video/mp4">
        </video>
    </div>

    <div class="work">
        <h2>❄️ 东方古风雪景场景</h2>
        <p>参考东方古建筑风格搭建场景，整合雪景资产，调整积雪材质，搭配远山与河流，营造冬日山林静谧氛围。</p>
        <img src="images/snowscene.jpg" alt="东方古风雪景场景">
    </div>

    <div class="work">
        <h2>🎨 风格化场景</h2>
        <p>依据参考搭建场景，重组模块化资产，调整材质色彩，塑造远景环境氛围。</p>
        <img src="images/stylized.jpg" alt="风格化场景">
    </div>

    <div class="contact">
        <h3>Contact</h3>
        <p>邮箱：2062962596@qq.com</p>
    </div>
</body>
</html>
